# ============================================================
# Descrições para dicas
# ============================================================

DescBackground="Configurações do fundo do padrão e efeitos de borda."
DescOverrideSourceBackground="Substitui a fonte original por uma cor sólida. Ative para usar o seletor de cor abaixo."
DescBackgroundColour="Cor sólida quando 'Substituir fundo' está ativo. O alpha controla a opacidade."
DescVignette="Intensidade do escurecimento nas bordas. 0 = sem efeito, 1 = cantos totalmente escuros."
DescVignetteSize="Distância do centro onde a vinheta começa (0 = centro, 1 = cantos)."
DescVignetteSoftness="Largura da transição entre brilho total e escuridão total."
DescGlow="Intensidade do halo luminoso ao redor de cada forma. 0 = sem brilho, 1 = brilho forte."
DescGlowRadius="Distância que o brilho se estende desde a borda da forma."
DescGlowColour="Cor do halo de brilho."
DescStrokeWidth="Espessura do contorno desenhado dentro de cada forma. 0 = sem contorno."
DescStrokeColour="Cor do contorno."

DescShape="Escolha a forma principal desenhada em cada célula."
DescMixWith="Escolha uma forma secundária. A grade irá misturar Forma e Misturar com baseado na Mistura."
DescObsSource="Escolha uma fonte OBS para usar como textura na forma Imagem / Fonte OBS."
DescUseSourceAsTexture="Quando ativado, a fonte OBS é rasterizada a cada frame e usada como textura. Quando desativado, o arquivo de imagem abaixo é usado."
DescCustomImage="Arquivo de imagem estática (PNG/JPG) usado como textura quando 'Usar fonte OBS' está desativado e Forma é Imagem / Fonte OBS."
DescImageAspectOverride="Substitui a proporção da fonte/imagem. 0 = proporção nativa."
DescImageFitMode="Como a imagem se ajusta em cada célula: Esticar (ignora proporção), Conter (pode deixar espaço), Cobrir (preenche, pode recortar)."
DescImageUseShapeMask="Quando ativado, a imagem é recortada com a forma escolhida em vez de preencher a célula."
DescImageMaskShape="Forma usada para mascarar a imagem."

DescGridPattern="Disposição das células: grade quadrada, tijolo (linhas alternadas) ou hex (favo de mel)."
DescGridSquare="Células quadradas (sem esticamento horizontal). Desative para esticar as células conforme a proporção da saída."
DescDensity="Número de células no lado mais longo. Maior = células menores, mais formas."
DescSize="Tamanho de cada forma dentro de sua célula. 0 = minúscula, 1 = preenche a célula."
DescGap="Espaço entre a forma e a borda de sua célula. 0 = sem espaço."
DescPatternScale="Zoom global do padrão. 1.0 = inalterado. > 1 = ampliado, < 1 = reduzido."
DescPatternOffsetX="Deslocamento horizontal do padrão (sem animação)."
DescPatternOffsetY="Deslocamento vertical do padrão (sem animação)."
DescEdgeSoftness="Suavidade do anti-aliasing na borda da forma. 0 = borda dura, 0.2 = muito suave."
DescShapeColour="Cor principal das formas."
DescSecondaryColour="Cor usada nos modos de cor secundária."
DescSecondaryMode="Como a cor secundária é aplicada."
DescSecondaryMix="Quanto da cor secundária se mistura. 0 = apenas base, 1 = apenas secundária."
DescPaletteCount="Quantas cores da paleta estão ativas. 1 = apenas cor base. 2+ = cada célula escolhe aleatoriamente."
DescColorB="Segunda cor da paleta. Usada apenas se Paleta for 2 ou mais."
DescColorC="Terceira cor da paleta. Usada apenas se Paleta for 3 ou mais."
DescColorD="Quarta cor da paleta. Usada apenas se Paleta for 4."

DescRotation="Rotação base aplicada a cada forma, em graus."
DescAutoRotate="Velocidade de rotação em graus por segundo. Negativo = anti-horário."
DescPolygonSides="Número de lados do polígono, ou pontas da estrela."
DescStarSharpness="Apenas para Estrela: nitidez das pontas. 2 = quase um polígono."
DescLineThickness="Espessura das formas Linha horizontal e Linha vertical."
DescRoundedSquareRadius="Raio dos cantos do quadrado arredondado. 0 = quadrado, 0.5 = quase um círculo."

DescVisibility="Probabilidade de uma célula mostrar sua forma. 1.0 = todas, 0.5 = metade."
DescTwinkleAmount="Quanto cada célula pisca. 0 = sem piscar, 1 = fade completo."
DescTwinkleSpeed="Velocidade do ciclo de piscar."
DescSizeVariation="Variação aleatória de tamanho por célula. 0 = todas iguais, 1 = até ±50%."
DescRotationVariation="Variação aleatória de rotação por célula, em graus. 0 = mesma rotação, 180 = totalmente aleatório."
DescShapeMix="Probabilidade de uma célula usar a forma secundária (Misturar com) em vez da principal."
DescShapeMixBlendWidth="Largura da transição suave entre Forma A e Forma B. 0 = alternância binária dura."
DescShapeMixIndependentMotion="Quando ativado, células usando Forma B têm deslocamento de fase para brilho e pulsação."
DescHueVariation="Mudança aleatória de matiz por célula. 0 = sem mudança, 1 = arco-íris completo."
DescColorJitter="Dispersão aleatória de cor por célula. 0 = mesma cor, 1 = totalmente aleatório."
DescSeed="Semente aleatória. Use o botão 🎲 para escolher um valor aleatório."

DescScrollSpeed="Velocidade da rolagem. Multiplicada pelo ângulo para produzir um vetor de direção."
DescScrollAngle="Direção da rolagem, em graus. 0 = direita, 90 = baixo, 180 = esquerda, 270 = cima."
DescGradientAxis="Aplica um gradiente direcional para tamanho e/ou matiz. Nenhum = desativado."
DescGradientSizeAmount="Quanto as formas crescem (positivo) ou diminuem (negativo) ao longo do eixo."
DescGradientHueAmount="Quanto a matiz muda ao longo do eixo do gradiente."
DescDriftAmount="Quanto cada célula vagueia ao redor de seu centro. 0 = sem deriva, 1 = deriva significativa."
DescDriftSpeed="Velocidade do ciclo de deriva."
DescPulseAmount="Quanto cada célula pulsa em tamanho. 0 = sem pulso, 1 = até metade do tamanho."
DescPulseSpeed="Velocidade do ciclo de pulso."
DescWaveAmount="Faz colunas de células oscilarem em uma onda senoidal. 0 = desativado."
DescWaveFrequency="Quantas cristas de onda cabem na largura do padrão."
DescWaveSpeed="Velocidade de propagação da onda."
DescOrbitAmount="Faz todo o padrão orbitar ao redor do centro. Negativo inverte a direção. 0 = desativado."
DescOrbitSpeed="Velocidade de rotação da órbita em graus por segundo."

DescRenderScale="Renderiza o filtro em resolução reduzida e amplia. 1.0 = qualidade máxima, 0.5 = metade para melhor desempenho."
