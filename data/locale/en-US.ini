# ============================================================
# Tooltip descriptions
# ============================================================

DescBackground="Settings for the pattern's background fill and edge effects."
DescOverrideSourceBackground="Replace the original source with a solid colour. Enable to use the background colour slider below."
DescBackgroundColour="Solid colour to use when 'Override Source Background' is enabled. Alpha controls opacity."
DescVignette="Strength of the darkening at the edges of the output. 0 = no effect, 1 = corners fully dark."
DescVignetteSize="Distance from center where the vignette starts (0 = center, 1 = corners)."
DescVignetteSoftness="Width of the falloff between full brightness and full darkness."
DescGlow="Strength of the luminous halo around each shape. 0 = no glow, 1 = strong glow."
DescGlowRadius="How far the glow extends from the shape edge."
DescGlowColour="Colour of the glow halo."
DescStrokeWidth="Thickness of the outline drawn inside each shape. 0 = no stroke."
DescStrokeColour="Colour of the outline."

DescShape="Choose the main shape drawn in each cell of the grid."
DescMixWith="Choose a secondary shape. The grid will mix between Shape and Mix With based on Shape Mix."
DescObsSource="Choose an OBS source to use as the texture for the Image / OBS Source shape."
DescUseSourceAsTexture="When ON, the selected OBS source is rasterized each frame and used as texture. When OFF, the image file below is used."
DescCustomImage="Static image file (PNG/JPG) used as texture when 'Use OBS Source' is OFF and Shape is Image / OBS Source."
DescImageAspectOverride="Override the source/image aspect ratio. 0 = use the source's native aspect. Useful for forcing square or wide tiles."
DescImageFitMode="How the image fits inside each cell: Stretch (ignore aspect), Contain (fit inside, may leave gaps), Cover (fill cell, may crop)."
DescImageUseShapeMask="When enabled, the image is clipped to the shape chosen in Mask Shape instead of filling the entire cell."
DescImageMaskShape="Shape used to mask the image when 'Mask Image with Shape' is enabled."

DescGridPattern="How cells are laid out: square grid, brick (offset rows), or hex (honeycomb)."
DescGridSquare="Square cells (no horizontal stretch). Disable to stretch cells to fill the output aspect."
DescDensity="Number of cells along the longer side. Higher = smaller cells, more shapes."
DescSize="Size of each shape inside its cell. 0 = tiny, 1 = fills the cell."
DescGap="Space between the shape and the edge of its cell. 0 = no gap, 0.95 = tiny shape in a large empty cell."
DescPatternScale="Overall zoom of the pattern. 1.0 = no change. > 1 = zoomed in, < 1 = zoomed out."
DescPatternOffsetX="Horizontal offset of the pattern (no animation). Useful for aligning with another source."
DescPatternOffsetY="Vertical offset of the pattern (no animation)."
DescEdgeSoftness="Anti-aliasing softness at the shape edge. 0 = hard edge, 0.2 = very soft."
DescShapeColour="Main colour of the shapes."
DescSecondaryColour="Colour used in the secondary colour modes."
DescSecondaryMode="How the secondary colour is applied: Solid (everywhere), Radial (gradient from center), Alternate (random per cell), By Shape (only Shape B cells)."
DescSecondaryMix="How much of the secondary colour blends in. 0 = only base, 1 = only secondary."
DescPaletteCount="How many palette colours are active. 1 = only base colour. 2+ = each cell randomly picks from the active colours."
DescColorB="Second palette colour. Only used when Palette Colours is 2 or more."
DescColorC="Third palette colour. Only used when Palette Colours is 3 or more."
DescColorD="Fourth palette colour. Only used when Palette Colours is 4."

DescRotation="Base rotation applied to every shape, in degrees."
DescAutoRotate="Rotation speed in degrees per second. Negative = counter-clockwise."
DescPolygonSides="Number of sides for Polygon, or points for Star."
DescStarSharpness="For Star only: how sharp the points are. 2 = almost a polygon, higher = more pointy."
DescLineThickness="Thickness of Horizontal Line and Vertical Line shapes. Only applies when Shape or Mix With is Horizontal Line or Vertical Line."
DescRoundedSquareRadius="Corner radius of the Rounded Square shape. 0 = sharp square, 0.5 = almost a circle."

DescVisibility="Probability that a cell shows its shape. 1.0 = all cells, 0.5 = half cells."
DescTwinkleAmount="How much each cell fades in and out. 0 = no twinkle, 1 = full fade."
DescTwinkleSpeed="How fast the twinkle animation cycles."
DescSizeVariation="Random size variation per cell. 0 = all same size, 1 = up to half/half variation."
DescRotationVariation="Random rotation variation per cell, in degrees. 0 = all same rotation, 180 = full random."
DescShapeMix="Probability that a cell uses the secondary shape (Mix With) instead of the main shape."
DescShapeMixBlendWidth="Width of the smooth transition zone between Shape A and Shape B. 0 = hard binary switch. Greater than 0 = smooth SDF blend near the threshold."
DescShapeMixIndependentMotion="When enabled, cells using Shape B get a phase offset for twinkle and pulse so they animate independently from Shape A cells."
DescHueVariation="Random hue shift per cell. 0 = no shift, 1 = full rainbow."
DescColorJitter="Random per-cell colour jitter. 0 = all cells same colour, 1 = fully random colours."
DescSeed="Random seed offset. Use the 🎲 Random Seed button to pick a random value."

DescScrollSpeed="How fast the pattern scrolls. Speed is multiplied by the angle to produce a direction vector."
DescScrollAngle="Direction of the scroll, in degrees. 0 = right, 90 = down, 180 = left, 270 = up."
DescGradientAxis="Apply a directional gradient for size and/or hue across the pattern. None = disabled."
DescGradientSizeAmount="How much shapes grow (positive) or shrink (negative) along the gradient axis."
DescGradientHueAmount="How much the hue rotates along the gradient axis."
DescDriftAmount="How much each cell wanders around its center. 0 = no drift, 1 = significant drift."
DescDriftSpeed="How fast the drift animation cycles."
DescPulseAmount="How much each cell pulses in size. 0 = no pulse, 1 = up to half size."
DescPulseSpeed="How fast the pulse animation cycles."
DescWaveAmount="Makes columns of cells oscillate in a sine wave, like a flag waving. 0 = disabled."
DescWaveFrequency="How many wave crests fit across the pattern width."
DescWaveSpeed="How fast the wave travels across the pattern."
DescOrbitAmount="Rotates the entire pattern around the canvas centre. Negative reverses direction. 0 = disabled."
DescOrbitSpeed="Speed of the pattern orbit rotation in degrees per second."

DescRenderScale="Render the filter at a reduced resolution and upscale. 1.0 = full quality, 0.5 = half res for better performance."
