# ============================================================
# Descripciones para tooltips
# ============================================================

DescBackground="Ajustes del fondo del patrón y los efectos de bordes."
DescOverrideSourceBackground="Reemplaza el source original con un color sólido. Activa para usar el color de fondo de abajo."
DescBackgroundColour="Color sólido cuando 'Sobreescribir Fondo' está activo. El alpha controla la opacidad."
DescVignette="Intensidad del oscurecimiento en los bordes. 0 = sin efecto, 1 = esquinas totalmente oscuras."
DescVignetteSize="Distancia desde el centro donde empieza la viñeta (0 = centro, 1 = esquinas)."
DescVignetteSoftness="Ancho de la transición entre brillo completo y oscuridad total."
DescGlow="Intensidad del halo luminoso alrededor de cada forma. 0 = sin brillo, 1 = brillo fuerte."
DescGlowRadius="Qué tan lejos se extiende el brillo desde el borde de la forma."
DescGlowColour="Color del halo de brillo."
DescStrokeWidth="Grosor del contorno dibujado dentro de cada forma. 0 = sin borde."
DescStrokeColour="Color del contorno."

DescShape="Elige la forma principal dibujada en cada celda."
DescMixWith="Elige una forma secundaria. La rejilla mezclará entre Forma y Mezclar Con según Mezcla."
DescObsSource="Elige una fuente OBS para usar como textura en la forma Image / OBS Source."
DescUseSourceAsTexture="Si está activo, la fuente OBS se rasteriza cada frame y se usa como textura. Si está desactivado, se usa el archivo de imagen de abajo."
DescCustomImage="Archivo de imagen estática (PNG/JPG) usado como textura cuando 'Usar Fuente OBS' está desactivado y Forma es Image / OBS Source."
DescImageAspectOverride="Sobreescribe el aspect ratio del source/imagen. 0 = usar el aspect nativo. Útil para forzar tiles cuadrados o anchos."
DescImageFitMode="Cómo encaja la imagen dentro de cada celda: Estirar (ignorar proporción), Contener (se ve completa, puede dejar bordes vacíos), Cubrir (llena la celda, puede recortar)."
DescImageUseShapeMask="Si está activo, la imagen se recorta con la forma elegida en Forma de Máscara en lugar de llenar toda la celda."
DescImageMaskShape="Forma usada para recortar la imagen cuando 'Mascarar Imagen con Forma' está activo."

DescGridPattern="Disposición de las celdas: cuadrícula, brick (filas alternadas) o hex (panal)."
DescGridSquare="Celdas cuadradas (sin estiramiento horizontal). Desactiva para estirar las celdas al aspect del output."
DescDensity="Número de celdas en el lado más largo. Mayor = celdas más pequeñas, más formas."
DescSize="Tamaño de cada forma dentro de su celda. 0 = diminuta, 1 = llena la celda."
DescGap="Espacio entre la forma y el borde de su celda. 0 = sin espacio, 0.95 = forma pequeña en celda grande."
DescPatternScale="Zoom global del patrón. 1.0 = sin cambio. > 1 = ampliado, < 1 = reducido."
DescPatternOffsetX="Desplazamiento horizontal del patrón (sin animar). Útil para alinear con otro source."
DescPatternOffsetY="Desplazamiento vertical del patrón (sin animar)."
DescEdgeSoftness="Suavizado del anti-aliasing en el borde. 0 = borde duro, 0.2 = muy suave."
DescShapeColour="Color principal de las formas."
DescSecondaryColour="Color usado en los modos de color secundario."
DescSecondaryMode="Cómo se aplica el color secundario: Sólido (en todas partes), Radial (gradiente desde el centro), Alternado (aleatorio por celda), Por Forma (solo celdas de Forma B)."
DescSecondaryMix="Cuánto del color secundario se mezcla. 0 = solo base, 1 = solo secundario."
DescPaletteCount="Cuántos colores de paleta están activos. 1 = solo color base. 2+ = cada celda elige al azar entre los colores activos."
DescColorB="Segundo color de paleta. Solo se usa si Colores de Paleta es 2 o más."
DescColorC="Tercer color de paleta. Solo se usa si Colores de Paleta es 3 o más."
DescColorD="Cuarto color de paleta. Solo se usa si Colores de Paleta es 4."

DescRotation="Rotación base aplicada a cada forma, en grados."
DescAutoRotate="Velocidad de rotación en grados por segundo. Negativo = antihorario."
DescPolygonSides="Número de lados del Polígono, o puntas de la Estrella."
DescStarSharpness="Solo para Estrella: qué tan afiladas son las puntas. 2 = casi polígono, mayor = más afiladas."
DescLineThickness="Grosor de las formas Horizontal Line y Vertical Line. Solo aplica si Forma o Mezclar Con es Horizontal Line o Vertical Line."
DescRoundedSquareRadius="Radio de esquina del Cuadrado Redondeado. 0 = cuadrado normal, 0.5 = casi un círculo."

DescVisibility="Probabilidad de que una celda muestre su forma. 1.0 = todas, 0.5 = mitad."
DescTwinkleAmount="Cuánto parpadea cada celda. 0 = sin parpadeo, 1 = fade completo."
DescTwinkleSpeed="Velocidad del ciclo de parpadeo."
DescSizeVariation="Variación aleatoria de tamaño por celda. 0 = todas iguales, 1 = hasta ±50%."
DescRotationVariation="Variación aleatoria de rotación por celda, en grados. 0 = misma rotación, 180 = totalmente aleatorio."
DescShapeMix="Probabilidad de que una celda use la forma secundaria (Mezclar Con) en lugar de la principal."
DescShapeMixBlendWidth="Ancho de la zona de transición suave entre Forma A y Forma B. 0 = cambio binario duro. Mayor a 0 = mezcla suave de SDF cerca del umbral."
DescShapeMixIndependentMotion="Si está activo, las celdas que usan Forma B tienen un desfase de fase para parpadeo y pulso, animándose independientemente de Forma A."
DescHueVariation="Cambio de tono aleatorio por celda. 0 = sin cambio, 1 = arcoíris completo."
DescColorJitter="Dispersión aleatoria de color por celda. 0 = mismo color, 1 = totalmente aleatorio."
DescSeed="Semilla del random. Usa el botón 🎲 para elegir un valor aleatorio."

DescScrollSpeed="Velocidad del desplazamiento. Se multiplica por el ángulo para producir un vector de dirección."
DescScrollAngle="Dirección del desplazamiento, en grados. 0 = derecha, 90 = abajo, 180 = izquierda, 270 = arriba."
DescGradientAxis="Aplica un gradiente direccional para tamaño y/o tono a través del patrón. Ninguno = desactivado."
DescGradientSizeAmount="Cuánto crecen (positivo) o se achican (negativo) las formas a lo largo del eje del gradiente."
DescGradientHueAmount="Cuánto rota el tono a lo largo del eje del gradiente."
DescDriftAmount="Cuánto deambula cada celda alrededor de su centro. 0 = sin deriva, 1 = deriva significativa."
DescDriftSpeed="Velocidad del ciclo de deriva."
DescPulseAmount="Cuánto pulsa cada celda en tamaño. 0 = sin pulso, 1 = hasta mitad de tamaño."
DescPulseSpeed="Velocidad del ciclo de pulso."
DescWaveAmount="Hace que las columnas de celdas se desplacen en una ola senoidal, como una bandera ondulando. 0 = desactivado."
DescWaveFrequency="Cuántas crestas de la oila caben a lo ancho del patrón."
DescWaveSpeed="Qué tan rápido viaja la ola por el patrón."
DescOrbitAmount="Rota todo el patrón alrededor del centro del canvas. Negativo invierte el sentido. 0 = desactivado."
DescOrbitSpeed="Velocidad de rotación de la órbita en grados por segundo."

DescRenderScale="Renderiza el filtro a una resolución reducida y lo escala. 1.0 = calidad máxima, 0.5 = mitad para mejor rendimiento."
