# ============================================================
# Descriptions pour infobulles
# ============================================================

DescBackground="Paramètres de l'arrière-plan du motif et des effets de bord."
DescOverrideSourceBackground="Remplace la source originale par une couleur unie. Activez pour utiliser le sélecteur de couleur ci-dessous."
DescBackgroundColour="Couleur unie lorsque 'Remplacer l'arrière-plan' est actif. L'alpha contrôle l'opacité."
DescVignette="Force de l'assombrissement sur les bords. 0 = aucun effet, 1 = coins totalement sombres."
DescVignetteSize="Distance depuis le centre où la vignette commence (0 = centre, 1 = coins)."
DescVignetteSoftness="Largeur de la transition entre luminosité maximale et obscurité totale."
DescGlow="Force du halo lumineux autour de chaque forme. 0 = pas de lueur, 1 = forte lueur."
DescGlowRadius="Distance sur laquelle la lueur s'étend depuis le bord de la forme."
DescGlowColour="Couleur du halo."
DescStrokeWidth="Épaisseur du contour tracé à l'intérieur de chaque forme. 0 = pas de contour."
DescStrokeColour="Couleur du contour."

DescShape="Choisissez la forme principale dessinée dans chaque cellule."
DescMixWith="Choisissez une forme secondaire. La grille mélangera Forme et Mélanger avec selon le Mix."
DescObsSource="Choisissez une source OBS à utiliser comme texture pour la forme Image / Source OBS."
DescUseSourceAsTexture="Lorsqu'activé, la source OBS est rasterisée à chaque frame et utilisée comme texture. Sinon, le fichier image ci-dessous est utilisé."
DescCustomImage="Fichier image statique (PNG/JPG) utilisé comme texture quand 'Utiliser la source OBS' est désactivé et que la Forme est Image / Source OBS."
DescImageAspectOverride="Remplace le rapport d'aspect de la source/image. 0 = aspect natif."
DescImageFitMode="Comment l'image s'ajuste dans chaque cellule : Étirer (ignore l'aspect), Contenir (peut laisser des espaces), Couvrir (remplit, peut rogner)."
DescImageUseShapeMask="Lorsqu'activé, l'image est découpée avec la forme choisie au lieu de remplir la cellule."
DescImageMaskShape="Forme utilisée pour masquer l'image."

DescGridPattern="Disposition des cellules : grille carrée, brique (rangées décalées) ou hex (nid d'abeilles)."
DescGridSquare="Cellules carrées (sans étirement horizontal). Désactivez pour étirer les cellules selon l'aspect de la sortie."
DescDensity="Nombre de cellules sur le côté le plus long. Plus = cellules plus petites."
DescSize="Taille de chaque forme dans sa cellule. 0 = minuscule, 1 = remplit la cellule."
DescGap="Espace entre la forme et le bord de sa cellule. 0 = pas d'espace."
DescPatternScale="Zoom global du motif. 1.0 = inchangé. > 1 = zoomé, < 1 = dézoomé."
DescPatternOffsetX="Décalage horizontal du motif (sans animation)."
DescPatternOffsetY="Décalage vertical du motif (sans animation)."
DescEdgeSoftness="Adoucissement anti-aliasing du bord. 0 = bord dur, 0.2 = très doux."
DescShapeColour="Couleur principale des formes."
DescSecondaryColour="Couleur utilisée dans les modes couleur secondaire."
DescSecondaryMode="Comment la couleur secondaire est appliquée."
DescSecondaryMix="Quantité de la couleur secondaire mélangée. 0 = base uniquement, 1 = secondaire uniquement."
DescPaletteCount="Nombre de couleurs de palette actives. 1 = couleur de base uniquement. 2+ = chaque cellule choisit aléatoirement."
DescColorB="Deuxième couleur de palette. Utilisée uniquement si Palette est à 2 ou plus."
DescColorC="Troisième couleur de palette. Utilisée uniquement si Palette est à 3 ou plus."
DescColorD="Quatrième couleur de palette. Utilisée uniquement si Palette est à 4."

DescRotation="Rotation de base appliquée à chaque forme, en degrés."
DescAutoRotate="Vitesse de rotation en degrés par seconde. Négatif = antihoraire."
DescPolygonSides="Nombre de côtés du polygone, ou pointes de l'étoile."
DescStarSharpness="Pour Étoile uniquement : netteté des pointes. 2 = presque un polygone."
DescLineThickness="Épaisseur des formes Ligne horizontale et Ligne verticale."
DescRoundedSquareRadius="Rayon des coins du carré arrondi. 0 = carré, 0.5 = presque un cercle."

DescVisibility="Probabilité qu'une cellule montre sa forme. 1.0 = toutes, 0.5 = moitié."
DescTwinkleAmount="Quantité de scintillement par cellule. 0 = aucun, 1 = fondu complet."
DescTwinkleSpeed="Vitesse du cycle de scintillement."
DescSizeVariation="Variation aléatoire de taille par cellule. 0 = identique, 1 = jusqu'à ±50%."
DescRotationVariation="Variation aléatoire de rotation par cellule, en degrés. 0 = identique, 180 = totalement aléatoire."
DescShapeMix="Probabilité qu'une cellule utilise la forme secondaire (Mélanger avec) au lieu de la forme principale."
DescShapeMixBlendWidth="Largeur de la transition fluide entre Forme A et Forme B. 0 = basculement binaire dur."
DescShapeMixIndependentMotion="Lorsqu'activé, les cellules utilisant Forme B ont un décalage de phase pour scintillement et pulsation."
DescHueVariation="Décalage de teinte aléatoire par cellule. 0 = aucun, 1 = arc-en-ciel complet."
DescColorJitter="Dispersion aléatoire de couleur par cellule. 0 = même couleur, 1 = totalement aléatoire."
DescSeed="Graine du générateur aléatoire. Utilisez le bouton 🎲 pour une valeur aléatoire."

DescScrollSpeed="Vitesse du défilement. Multipliée par l'angle pour produire un vecteur de direction."
DescScrollAngle="Direction du défilement, en degrés. 0 = droite, 90 = bas, 180 = gauche, 270 = haut."
DescGradientAxis="Applique un dégradé directionnel pour taille et/ou teinte. Aucun = désactivé."
DescGradientSizeAmount="Combien les formes grandissent (positif) ou rétrécissent (négatif) le long de l'axe."
DescGradientHueAmount="Combien la teinte change le long de l'axe du dégradé."
DescDriftAmount="Quantité de dérive aléatoire de chaque cellule autour de son centre."
DescDriftSpeed="Vitesse du cycle de dérive."
DescPulseAmount="Quantité de pulsation de taille par cellule. 0 = aucune, 1 = jusqu'à moitié de taille."
DescPulseSpeed="Vitesse du cycle de pulsation."
DescWaveAmount="Déplace les colonnes de cellules dans une vague sinusoïdale. 0 = désactivé."
DescWaveFrequency="Nombre de crêtes de vague sur la largeur du motif."
DescWaveSpeed="Vitesse de propagation de la vague."
DescOrbitAmount="Fait orbiter le motif autour du centre. Négatif inverse la direction. 0 = désactivé."
DescOrbitSpeed="Vitesse de rotation de l'orbite en degrés par seconde."

DescRenderScale="Rend le filtre à une résolution réduite et met à l'échelle. 1.0 = qualité maximale, 0.5 = moitié pour de meilleures performances."
