# ============================================================
# Beschreibungen für Tooltips
# ============================================================

DescBackground="Einstellungen für den Musterhintergrund und Randeffekte."
DescOverrideSourceBackground="Ersetzt die Originalquelle durch eine Vollfarbe. Aktivieren Sie, um den Farbwähler unten zu verwenden."
DescBackgroundColour="Vollfarbe, wenn 'Quellhintergrund überschreiben' aktiv ist. Alpha steuert die Deckkraft."
DescVignette="Stärke der Randverdunkelung. 0 = keine Wirkung, 1 = Ecken vollständig dunkel."
DescVignetteSize="Abstand vom Zentrum, an dem die Vignette beginnt (0 = Zentrum, 1 = Ecken)."
DescVignetteSoftness="Breite des Übergangs zwischen voller Helligkeit und voller Dunkelheit."
DescGlow="Stärke des Leuchthofs um jede Form. 0 = kein Leuchten, 1 = starkes Leuchten."
DescGlowRadius="Wie weit sich das Leuchten vom Formrand aus erstreckt."
DescGlowColour="Farbe des Leuchthofs."
DescStrokeWidth="Dicke des Konturs innerhalb jeder Form. 0 = keine Kontur."
DescStrokeColour="Farbe des Konturs."

DescShape="Wählen Sie die Hauptform, die in jeder Zelle gezeichnet wird."
DescMixWith="Wählen Sie eine Sekundärform. Das Raster mischt Form und Mischen mit gemäß dem Mix."
DescObsSource="Wählen Sie eine OBS-Quelle als Textur für die Form Bild / OBS-Quelle."
DescUseSourceAsTexture="Wenn aktiv, wird die OBS-Quelle jeden Frame rasterisiert und als Textur verwendet. Wenn deaktiv, wird die Bilddatei unten verwendet."
DescCustomImage="Statische Bilddatei (PNG/JPG), die als Textur verwendet wird, wenn 'OBS-Quelle verwenden' deaktiviert ist und Form Bild / OBS-Quelle ist."
DescImageAspectOverride="Überschreibt das Seitenverhältnis der Quelle/des Bildes. 0 = natives Seitenverhältnis."
DescImageFitMode="Wie das Bild in jede Zelle passt: Strecken (ignoriert Seitenverhältnis), Einpassen (kann Lücken lassen), Abdecken (füllt, kann schneiden)."
DescImageUseShapeMask="Wenn aktiv, wird das Bild mit der gewählten Form statt der gesamten Zelle maskiert."
DescImageMaskShape="Form zum Maskieren des Bildes."

DescGridPattern="Anordnung der Zellen: quadratisches Raster, Backstein (versetzte Reihen) oder Hex (Bienenwabe)."
DescGridSquare="Quadratische Zellen (ohne horizontale Streckung). Deaktivieren, um Zellen auf das Aspektverhältnis der Ausgabe zu strecken."
DescDensity="Anzahl der Zellen auf der längeren Seite. Höher = kleinere Zellen."
DescSize="Größe jeder Form in ihrer Zelle. 0 = winzig, 1 = füllt die Zelle."
DescGap="Abstand zwischen Form und Zellenrand. 0 = kein Abstand."
DescPatternScale="Globaler Zoom des Musters. 1.0 = unverändert. > 1 = vergrößert, < 1 = verkleinert."
DescPatternOffsetX="Horizontaler Versatz des Musters (ohne Animation)."
DescPatternOffsetY="Vertikaler Versatz des Musters (ohne Animation)."
DescEdgeSoftness="Anti-Aliasing-Weichheit an der Formkante. 0 = harte Kante, 0.2 = sehr weich."
DescShapeColour="Hauptfarbe der Formen."
DescSecondaryColour="Farbe, die in den Sekundärfarbmodi verwendet wird."
DescSecondaryMode="Wie die Sekundärfarbe angewendet wird."
DescSecondaryMix="Anteil der Sekundärfarbe in der Mischung. 0 = nur Basis, 1 = nur Sekundär."
DescPaletteCount="Anzahl der aktiven Palettenfarben. 1 = nur Basisfarbe. 2+ = jede Zelle wählt zufällig."
DescColorB="Zweite Palettenfarbe. Nur bei Palette 2 oder mehr."
DescColorC="Dritte Palettenfarbe. Nur bei Palette 3 oder mehr."
DescColorD="Vierte Palettenfarbe. Nur bei Palette 4."

DescRotation="Basisdrehung für jede Form, in Grad."
DescAutoRotate="Drehgeschwindigkeit in Grad pro Sekunde. Negativ = gegen den Uhrzeigersinn."
DescPolygonSides="Anzahl der Seiten des Polygons oder Spitzen des Sterns."
DescStarSharpness="Nur für Stern: Schärfe der Spitzen. 2 = fast ein Polygon, höher = spitzer."
DescLineThickness="Stärke der Horizontalen und Vertikalen Linien Formen."
DescRoundedSquareRadius="Eckenradius des abgerundeten Quadrats. 0 = Quadrat, 0.5 = fast ein Kreis."

DescVisibility="Wahrscheinlichkeit, dass eine Zelle ihre Form zeigt. 1.0 = alle, 0.5 = Hälfte."
DescTwinkleAmount="Stärke des Flimmerns pro Zelle. 0 = kein Flimmern, 1 = vollständiges Ein-/Ausblenden."
DescTwinkleSpeed="Geschwindigkeit des Flimmerzyklus."
DescSizeVariation="Zufällige Größenvariation pro Zelle. 0 = identisch, 1 = bis zu ±50%."
DescRotationVariation="Zufällige Drehungsvariation pro Zelle, in Grad. 0 = identisch, 180 = vollständig zufällig."
DescShapeMix="Wahrscheinlichkeit, dass eine Zelle die Sekundärform (Mischen mit) statt der Hauptform verwendet."
DescShapeMixBlendWidth="Breite des weichen Übergangs zwischen Form A und Form B. 0 = harter binärer Wechsel."
DescShapeMixIndependentMotion="Wenn aktiv, haben Zellen mit Form B eine Phasenverschiebung für Flimmern und Pulsation."
DescHueVariation="Zufällige Farbtonverschiebung pro Zelle. 0 = keine, 1 = kompletter Regenbogen."
DescColorJitter="Zufällige Farbstreuung pro Zelle. 0 = gleiche Farbe, 1 = vollständig zufällig."
DescSeed="Zufalls-Seed-Versatz. Verwenden Sie die 🎲-Schaltfläche für einen Zufallswert."

DescScrollSpeed="Scroll-Geschwindigkeit. Wird mit dem Winkel multipliziert, um einen Richtungsvektor zu erzeugen."
DescScrollAngle="Scroll-Richtung in Grad. 0 = rechts, 90 = unten, 180 = links, 270 = oben."
DescGradientAxis="Richtet einen Richtungsverlauf für Größe und/oder Farbton. Keine = deaktiviert."
DescGradientSizeAmount="Wie stark Formen entlang der Achse wachsen (positiv) oder schrumpfen (negativ)."
DescGradientHueAmount="Wie stark sich der Farbton entlang der Verlaufsachse ändert."
DescDriftAmount="Stärke der zufälligen Drift jeder Zelle um ihr Zentrum. 0 = keine Drift, 1 = signifikant."
DescDriftSpeed="Geschwindigkeit des Drift-Zyklus."
DescPulseAmount="Stärke der Größenpulsation pro Zelle. 0 = keine, 1 = bis zur Hälfte der Größe."
DescPulseSpeed="Geschwindigkeit des Pulsationszyklus."
DescWaveAmount="Lässt Zellensäulen in einer sinusförmigen Welle schwingen. 0 = deaktiviert."
DescWaveFrequency="Anzahl der Wellenberste über die Musterbreite."
DescWaveSpeed="Geschwindigkeit der Wellenausbreitung."
DescOrbitAmount="Lässt das gesamte Muster um die Canvas-Mitte kreisen. Negativ = umgekehrte Richtung. 0 = deaktiviert."
DescOrbitSpeed="Umlaufgeschwindigkeit in Grad pro Sekunde."

DescRenderScale="Rendert den Filter in reduzierter Auflösung und skaliert hoch. 1.0 = volle Qualität, 0.5 = halbe Auflösung für bessere Leistung."
